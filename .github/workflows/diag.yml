name: Diagnose voice fetch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Probe HF checkpoint
        run: |
          pip install -q huggingface_hub
          python training/diag_fetch.py || true
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add training/diag.txt
          git commit -m "diag: HF checkpoint probe [skip ci]" || echo "no changes"
          git push
